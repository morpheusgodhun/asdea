name: APK Olustur
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Projeyi bul ve derle
        run: |
          S=$(find . -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$S")"
          set +e
          gradle assembleDebug --no-daemon --console=plain > /tmp/build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            {
              echo "## Derleme hatalari (tamami)"
              echo '```'
              grep -E "^e: |What went wrong|Execution failed|Could not|error:" -A3 /tmp/build.log | sed 's#file://[^ ]*/com/polis/hazirlik/##' | head -n 150
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $CODE
      - name: Log dosyasini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: PolislikHazirlik-apk
          path: "**/app-debug.apk"
